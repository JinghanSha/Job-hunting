name: Update jobs and deploy Pages

on:
  workflow_dispatch:
  schedule:
    # 23:30 UTC is 07:30 the following day in Asia/Shanghai and Asia/Singapore.
    - cron: '30 23 * * *'
  push:
    branches:
      - main

jobs:
  update-jobs:
    name: Update jobs data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Update jobs
        run: python scripts/update_jobs.py

      - name: Check whether jobs data changed
        id: jobs-change
        run: |
          if git diff --quiet -- data/jobs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated jobs data
        if: steps.jobs-change.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "chore: update jobs data"
          git push

  deploy-pages:
    name: Deploy GitHub Pages
    needs: update-jobs
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
